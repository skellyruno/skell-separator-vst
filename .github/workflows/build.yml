name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test release package verifier
        run: python -m unittest discover -s tests -p "test_vst3_package.py" -v
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Release VST3
        run: cmake --build build --config Release --parallel 2
      - name: Verify and stage one Windows VST3 bundle
        shell: pwsh
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $bundles = @(Get-ChildItem -LiteralPath build -Directory -Recurse -Filter 'Skell Separator.vst3' | Where-Object { $_.FullName -match '[\\/]Release[\\/]' })
          if ($bundles.Count -ne 1) { throw "Expected one Release Skell Separator.vst3 bundle; found $($bundles.Count)" }
          $project = Get-Content -LiteralPath CMakeLists.txt -Raw
          $versionMatch = [regex]::Match($project, 'project\s*\(\s*SkellSeparator\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $versionMatch.Success) { throw 'Could not read SkellSeparator VERSION from CMakeLists.txt' }
          $version = $versionMatch.Groups[1].Value
          python tools/verify_vst3_package.py --bundle $bundles[0].FullName --output-dir release-stage --source-head $env:SOURCE_HEAD_SHA --tested-commit $env:TESTED_COMMIT --run-id $env:GITHUB_RUN_ID --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw "VST3 package verifier failed with exit code $LASTEXITCODE" }
      - name: Install pinned pluginval 1.0.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip'
          Invoke-WebRequest -Uri $url -OutFile pluginval_Windows.zip
          Expand-Archive -LiteralPath pluginval_Windows.zip -DestinationPath pluginval -Force
          $validator = Get-ChildItem -LiteralPath pluginval -Recurse -File -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $validator) { throw 'Official pluginval 1.0.4 Windows executable was not found' }
          "PLUGINVAL_EXE=$($validator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate staged VST3 with pluginval strictness 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = Join-Path $PWD 'release-stage/Skell Separator.vst3'
          if (-not (Test-Path -LiteralPath $bundle -PathType Container)) { throw "Staged VST3 bundle missing: $bundle" }
          $reportDir = Join-Path $PWD 'pluginval-reports'
          New-Item -ItemType Directory -Path $reportDir -Force | Out-Null
          $stdoutPath = Join-Path $reportDir 'pluginval.stdout.log'
          $stderrPath = Join-Path $reportDir 'pluginval.stderr.log'
          $argumentLine = '--strictness-level 5 --validate-in-process --output-dir "{0}" "{1}"' -f $reportDir, $bundle
          $process = Start-Process -FilePath $env:PLUGINVAL_EXE -ArgumentList $argumentLine -Wait -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          if (Test-Path -LiteralPath $stdoutPath) { Get-Content $stdoutPath | ForEach-Object { Write-Host $_ } }
          if (Test-Path -LiteralPath $stderrPath) { Get-Content $stderrPath | ForEach-Object { Write-Host $_ } }
          if ($process.ExitCode -ne 0) { throw "pluginval strictness 5 failed with exit code $($process.ExitCode)" }
          $reports = @(Get-ChildItem -LiteralPath $reportDir -File -Filter '*.txt')
          if ($reports.Count -ne 1) { throw "Expected one pluginval report, found $($reports.Count)" }
          $reportText = Get-Content -LiteralPath $reports[0].FullName -Raw
          if (-not $reportText.Trim().EndsWith('SUCCESS') -or $reportText.Contains('FAILURE')) { throw 'pluginval report does not end in a clean SUCCESS marker' }
      - name: Upload pluginval diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkellSeparator-pluginval-report
          path: pluginval-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload one-extraction VST3 preview and provenance
        uses: actions/upload-artifact@v4
        with:
          name: SkellSeparator-Windows-VST3
          path: release-stage/**
          if-no-files-found: error
          retention-days: 7
