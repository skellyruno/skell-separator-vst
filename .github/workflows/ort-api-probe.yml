name: Skell Separator / Fast Windows ONNX API Probe
on:
  push:
    branches: [research/stemgenrt-vocal-backend]
    paths:
      - 'tests/ort_api_probe/**'
      - '.github/workflows/ort-api-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download official ONNX Runtime 1.26 CPU SDK (no model weights)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest -Uri 'https://github.com/microsoft/onnxruntime/releases/download/v1.26.0/onnxruntime-win-x64-1.26.0.zip' -OutFile ort-sdk.zip
          Expand-Archive ort-sdk.zip ort-sdk
          if (!(Test-Path 'ort-sdk/onnxruntime-win-x64-1.26.0/include/onnxruntime_cxx_api.h')) { throw 'Missing SDK headers' }
      - name: Compile isolated C/C++ runtime probe (no JUCE)
        shell: pwsh
        run: |
          cmake -S tests/ort_api_probe -B build-ort-probe -A x64 -DONNXRUNTIME_ROOT="$PWD/ort-sdk/onnxruntime-win-x64-1.26.0"
          cmake --build build-ort-probe --config Release
      - name: Run API and memory-construction probe
        shell: pwsh
        run: |
          $env:PATH = "$PWD/ort-sdk/onnxruntime-win-x64-1.26.0/lib;$env:PATH"
          & ./build-ort-probe/Release/SkellOrtApiProbe.exe
          if ($LASTEXITCODE -ne 0) { throw "ORT API probe failed: $LASTEXITCODE" }
