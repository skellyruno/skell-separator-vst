name: Skell Separator / Actual JUCE UI screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-screenshots.yml'
      - 'CMakeLists.txt'
      - 'Source/**'
      - 'tests/ui_renderer.cpp'
  pull_request:

jobs:
  actual-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux build / virtual display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure actual-editor capture with pinned JUCE and SkellCore
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_BUILD_UI_RENDERER=ON
      - name: Compile actual processor/editor and screenshot harness
        run: cmake --build build-ui --target SkellSeparatorUIRenderer --parallel 2
      - name: Capture and validate real editor scenes
        shell: bash
        run: |
          set -euo pipefail
          renderer=$(find build-ui -type f -name SkellSeparatorUIRenderer -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$renderer" --output ui-screenshots
          test "$(find ui-screenshots -name '*.png' | wc -l)" -eq 8
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Skell-Separator-Real-UI-Screenshots
          path: ui-screenshots/*
          if-no-files-found: warn
          retention-days: 30
